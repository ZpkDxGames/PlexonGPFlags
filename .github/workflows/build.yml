name: Build

on:
  push:
    branches: [main, 'release/**', 'agent/**', 'phase2/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.1.0'}
      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum --check
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify source, tests, Javadocs and distribution
        run: gradle clean check javadoc --stacktrace
      - name: Generate test summary and checksum
        run: |
          python3 - <<'PY' > TEST_SUMMARY.txt
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(f'Tests: {t} executed / {f} failures / {e} errors / {s} skipped')
          print('candidate=1.1.0-rc.1')
          print('runtime_certification=NOT_EXECUTED')
          PY
          cd build/libs
          sha256sum PlexonGPFlags-1.1.0-rc.1.jar > ../../SHA256SUMS.txt
          cd ../..
          (cd build/libs && cp ../../SHA256SUMS.txt . && sha256sum --check SHA256SUMS.txt)
          cat TEST_SUMMARY.txt
      - name: Upload candidate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PlexonGPFlags-1.1.0-rc.1-${{ github.sha }}
          path: |
            build/libs/PlexonGPFlags-1.1.0-rc.1.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
          if-no-files-found: error
          retention-days: 14
