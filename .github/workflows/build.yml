name: Build
on:
  push:
    branches: [main, 'release/**', 'closure/**', 'phase2/**', 'phase3/**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
env:
  ACCEPTED_PHASE3_SHA: 'b0a48d777e8344dfea1a187c11f00851fb2351a1'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.1.0'}
      - name: Provision exact PlexonCore 2.0.4
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum --check
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Read project version
        run: |
          set -euo pipefail
          version="$(gradle -q properties | sed -n 's/^version: //p')"
          test -n "$version"
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prove accepted lineage and platform contract
        run: |
          set -euo pipefail
          grep -F 'io.papermc.paper:paper-api:26.2.build.121-stable' build.gradle.kts
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
      - name: Verify source, tests, Javadocs and distribution
        run: gradle clean check javadoc --stacktrace
      - name: Generate evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib,os
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          version=os.environ['PLUGIN_VERSION']
          pathlib.Path('TEST_SUMMARY.txt').write_text(f'Tests: {t} executed / {f} failures / {e} errors / {s} skipped\nversion={version}\nruntime_certification=NOT_EXECUTED\n')
          print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          JAR="build/libs/PlexonGPFlags-${PLUGIN_VERSION}.jar"; test -s "$JAR"; jar tf "$JAR" > /tmp/jar.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: ${PLUGIN_VERSION}"; unzip -p "$JAR" plugin.yml | grep -F 'depend: [GriefPrevention]'
          javap -verbose -classpath "$JAR" com.plexon.gpflags.PlexonGPFlags | grep -F 'major version: 69'
          for p in 'com/zpkdxgames/plexoncore/' 'me/ryanhamshire/GriefPrevention/' 'org/bukkit/' 'io/papermc/' 'net/kyori/adventure/'; do if grep -q "^$p" /tmp/jar.txt; then echo "Unexpected bundled dependency: $p" >&2; exit 1; fi; done
          sha256sum "$JAR" > SHA256SUMS.txt; sha256sum --check SHA256SUMS.txt
          size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); { echo repository=$GITHUB_REPOSITORY; echo commit=$GITHUB_SHA; echo accepted_phase3=$ACCEPTED_PHASE3_SHA; echo version=$PLUGIN_VERSION; echo java_major=69; echo paper=26.2.build.121-stable; echo griefprevention=external_authority; echo plexoncore=2.0.4_external; echo schema=2_unchanged; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > PROVENANCE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: PlexonGPFlags-${{ github.sha }}
          path: |
            build/libs/PlexonGPFlags-*.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
            PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
