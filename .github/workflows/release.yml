name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: v1.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify and build
        run: gradle clean check --stacktrace

      - name: Generate checksum
        run: |
          cd build/libs
          sha256sum PlexonGPFlags-1.0.0.jar > ../../SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; nothing to do."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            build/libs/PlexonGPFlags-1.0.0.jar \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonGPFlags 1.0.0" \
            --generate-notes
