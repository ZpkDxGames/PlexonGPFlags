name: Release

on:
  push:
    branches: ['release/stable']

permissions:
  contents: write

env:
  ACCEPTED_PHASE3_SHA: 'b0a48d777e8344dfea1a187c11f00851fb2351a1'
  ROLLBACK_TAG: v1.0.1
  ROLLBACK_SHA: 757f62fa52fdb6ffa718c57ab4515b60c5aa23f3

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.1.0'}
      - name: Provision exact PlexonCore 2.0.4
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum --check
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Read project version
        run: |
          set -euo pipefail
          version="$(gradle -q properties | sed -n 's/^version: //p')"
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Verify stable boundary
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          case "$VERSION" in *-*) echo "Prerelease version cannot use stable publisher: $VERSION" >&2; exit 1;; esac
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha"
          test "$GITHUB_SHA" = "$main_sha"
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
          test -f ".release/RELEASE_NOTES_${VERSION}.md"
          test -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "v${VERSION} release already exists" >&2; exit 1; fi
      - name: Test, check, Javadoc and build exact stable source
        run: gradle clean check javadoc --stacktrace
      - name: Build exact release evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib,os
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          version=os.environ['VERSION']
          pathlib.Path('TEST_SUMMARY.txt').write_text(f'Tests: {t} executed / {f} failures / {e} errors / {s} skipped\nversion={version}\nruntime_certification=NOT_EXECUTED\n')
          print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          JAR="build/libs/PlexonGPFlags-${VERSION}.jar"; test -s "$JAR"; jar tf "$JAR" > /tmp/jar.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: ${VERSION}"; unzip -p "$JAR" plugin.yml | grep -F 'depend: [GriefPrevention]'
          javap -verbose -classpath "$JAR" com.plexon.gpflags.PlexonGPFlags | grep -F 'major version: 69'
          for p in 'com/zpkdxgames/plexoncore/' 'me/ryanhamshire/GriefPrevention/' 'org/bukkit/' 'io/papermc/' 'net/kyori/adventure/'; do if grep -q "^$p" /tmp/jar.txt; then echo "Unexpected bundled dependency: $p" >&2; exit 1; fi; done
          (cd build/libs && sha256sum "PlexonGPFlags-${VERSION}.jar") > SHA256SUMS.txt
          (cd build/libs && sha256sum --check ../../SHA256SUMS.txt)
          size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); cat > PROVENANCE.txt <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          tag=v${VERSION}
          version=${VERSION}
          accepted_phase3=${ACCEPTED_PHASE3_SHA}
          rollback_tag=${ROLLBACK_TAG}
          rollback_sha=${ROLLBACK_SHA}
          java=25
          class_major=69
          paper=26.2.build.121-stable
          griefprevention=external_authority
          plexoncore=2.0.4_external
          config_schema=2
          flag_store_schema=2
          jar_size=${size}
          jar_sha256=${digest}
          runtime_certification=NOT_EXECUTED
          EOF
      - name: Publish GitHub stable release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "v${VERSION}" \
            "build/libs/PlexonGPFlags-${VERSION}.jar" \
            SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonGPFlags ${VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md" \
            --latest
      - name: Verify published stable release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(gh release view "v${VERSION}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "v${VERSION}" --json tagName --jq '.tagName')" = "v${VERSION}"
          test "$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)" = "$GITHUB_SHA"
          assets="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')"
          for asset in "PlexonGPFlags-${VERSION}.jar" SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do grep -qx "$asset" <<<"$assets"; done
          mkdir published
          gh release download "v${VERSION}" --dir published
          (cd published && sha256sum --check SHA256SUMS.txt)
          grep -F "commit=${GITHUB_SHA}" published/PROVENANCE.txt
          grep -F 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PlexonGPFlags-release-${{ github.sha }}
          path: |
            build/libs/PlexonGPFlags-*.jar
            SHA256SUMS.txt
            TEST_SUMMARY.txt
            PROVENANCE.txt
          if-no-files-found: warn
          retention-days: 30
