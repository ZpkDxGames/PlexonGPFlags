name: Release 1.0.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: v1.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to replace assets." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'

      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum --check
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Verify and build
        run: gradle clean check --stacktrace

      - name: Generate and verify checksum
        run: |
          cd build/libs
          sha256sum PlexonGPFlags-1.0.1.jar > ../../SHA256SUMS.txt
          cd ../..
          cp SHA256SUMS.txt build/libs/SHA256SUMS.txt
          (cd build/libs && sha256sum --check SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            build/libs/PlexonGPFlags-1.0.1.jar \
            build/libs/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonGPFlags 1.0.1" \
            --notes 'Core 2.0.4 lifecycle/provenance maintenance release. Preserves GriefPrevention authority, legacy flags import, protection semantics, public APIs, and in-memory protection hot paths. Runtime certification remains NOT EXECUTED.'
