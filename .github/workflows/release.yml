name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Verify and build
        run: gradle clean check --stacktrace

      - name: Generate checksum
        run: |
          cd build/libs
          sha256sum PlexonGPFlags-1.0.0.jar > ../../SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/PlexonGPFlags-1.0.0.jar \
            SHA256SUMS.txt \
            --title "PlexonGPFlags 1.0.0" \
            --generate-notes
