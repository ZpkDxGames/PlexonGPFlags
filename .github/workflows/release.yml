name: Release 1.1.0 RC

on:
  push:
    branches: ['phase2/**']
    paths: ['.release/RC_READY']

permissions:
  contents: write

env:
  RELEASE_TAG: v1.1.0-rc.1
  VERSION: 1.1.0-rc.1
  ROLLBACK_TAG: v1.0.1
  ROLLBACK_SHA: 757f62fa52fdb6ffa718c57ab4515b60c5aa23f3

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Refuse existing RC boundary
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" || { echo "$RELEASE_TAG tag already exists" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "$RELEASE_TAG release already exists" >&2; exit 1; fi
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.1.0'}
      - name: Provision exact PlexonCore 2.0.4
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum --check
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify immutable candidate
        run: gradle clean check javadoc --stacktrace
      - name: Build evidence assets
        run: |
          cd build/libs
          sha256sum PlexonGPFlags-$VERSION.jar > ../../SHA256SUMS.txt
          cd ../..
          cp SHA256SUMS.txt build/libs/SHA256SUMS.txt
          (cd build/libs && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY' > TEST_SUMMARY.txt
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print(f'Tests: {t} executed / {f} failures / {e} errors / {s} skipped')
          print('runtime_certification=NOT_EXECUTED')
          PY
          cat > PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonGPFlags
          branch=${GITHUB_REF_NAME}
          candidate_sha=${GITHUB_SHA}
          version=${VERSION}
          rollback_tag=${ROLLBACK_TAG}
          rollback_sha=${ROLLBACK_SHA}
          java=25
          paper=26.2.build.121-stable
          plexoncore=2.0.4
          griefprevention=16.18.7 (Modrinth coordinate maven.modrinth:O4o4mKaq:dGfCZHqk)
          config_schema=2
          flag_store_schema=2
          runtime_certification=NOT_EXECUTED
          EOF
          cp TEST_SUMMARY.txt PROVENANCE.txt build/libs/
      - name: Tag exact candidate and publish prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" build/libs/PlexonGPFlags-$VERSION.jar build/libs/SHA256SUMS.txt build/libs/TEST_SUMMARY.txt build/libs/PROVENANCE.txt --verify-tag --prerelease --target "$GITHUB_SHA" --title "PlexonGPFlags 1.1.0-rc.1" --notes 'Phase 2 release candidate. GriefPrevention remains authoritative for claims. Deprecated PlexonClaimFlags/GriefPreventionAddon must not run simultaneously. Runtime certification is NOT EXECUTED; stable promotion remains blocked.'

  postverify:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - name: Verify published bytes, tag and prerelease state
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir verify && cd verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          sha256sum --check SHA256SUMS.txt
          javap -verbose -classpath PlexonGPFlags-$VERSION.jar com.plexon.gpflags.PlexonGPFlags | grep -F 'major version: 69'
          grep -F 'runtime_certification=NOT_EXECUTED' PROVENANCE.txt
          grep -F "candidate_sha=$GITHUB_SHA" PROVENANCE.txt
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin refs/tags/v1.1.0)"
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Stable release unexpectedly exists' >&2; exit 1; fi
