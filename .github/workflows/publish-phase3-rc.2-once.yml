name: Publish PlexonGPFlags 1.1.0-rc.2 once
on:
  push:
    branches: [phase3/release-v1.1.0-rc.2]
    paths: ['.github/workflows/publish-phase3-rc.2-once.yml']
permissions: {contents: write}
env: {PLUGIN_VERSION: '1.1.0-rc.2'}
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Prove release-only descendant
        run: |
          set -euo pipefail; UX=b0a48d777e8344dfea1a187c11f00851fb2351a1; git merge-base --is-ancestor "$UX" HEAD; git diff --name-only "$UX" HEAD >/tmp/delta
          if grep -Ev '^(build\.gradle\.kts|\.github/workflows/build\.yml|\.github/workflows/publish-phase3-rc\.2-once\.yml|\.release/RELEASE_NOTES_1\.1\.0-rc\.2\.md)$' /tmp/delta | grep -q .; then exit 1; fi
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '9.1.0'}
      - name: Provision exact PlexonCore
        run: |
          curl -fsSL -o /tmp/core.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar; echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/core.jar'|sha256sum -c -; mvn -B install:install-file -Dfile=/tmp/core.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Build exact candidate
        run: gradle clean check javadoc --stacktrace
      - name: Evidence
        run: |
          set -euo pipefail; test "$(gradle -q properties | sed -n 's/^version: //p')" = "$PLUGIN_VERSION"; grep -F 'io.papermc.paper:paper-api:26.2.build.121-stable' build.gradle.kts
          JAR=build/libs/PlexonGPFlags-${PLUGIN_VERSION}.jar; test -s "$JAR"; jar tf "$JAR" >/tmp/jar.txt; unzip -p "$JAR" plugin.yml | grep -F "version: ${PLUGIN_VERSION}"; unzip -p "$JAR" plugin.yml | grep -F 'depend: [GriefPrevention]'; javap -verbose -classpath "$JAR" com.plexon.gpflags.PlexonGPFlags | grep -F 'major version: 69'
          for p in 'com/zpkdxgames/plexoncore/' 'me/ryanhamshire/GriefPrevention/' 'org/bukkit/' 'io/papermc/' 'net/kyori/adventure/'; do if grep -q "^$p" /tmp/jar.txt; then exit 1; fi; done
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib
          t=f=e=s=0
          for p in glob.glob('build/test-results/test/*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          pathlib.Path('TEST_SUMMARY.txt').write_text(f'Tests: {t} executed / {f} failures / {e} errors / {s} skipped\nruntime_certification=NOT_EXECUTED\n'); print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          sha256sum "$JAR" > SHA256SUMS.txt; size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); { echo repository=$GITHUB_REPOSITORY; echo commit=$GITHUB_SHA; echo accepted_phase3=b0a48d777e8344dfea1a187c11f00851fb2351a1; echo version=$PLUGIN_VERSION; echo java_major=69; echo paper=26.2.build.121-stable; echo griefprevention=external_authority; echo schema=2_unchanged; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > PROVENANCE.txt
      - name: Publish immutable prerelease
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; TAG=v1.1.0-rc.2; if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi; if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          gh release create "$TAG" build/libs/PlexonGPFlags-1.1.0-rc.2.jar SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt --target "$GITHUB_SHA" --prerelease --title 'PlexonGPFlags 1.1.0-rc.2' --notes-file .release/RELEASE_NOTES_1.1.0-rc.2.md
