prompt-player: "%prefix%Type the player name in chat, or <white>cancel</white>. This prompt expires in <white>%seconds%s</white>."
prompt-cancelled: "%prefix%Input cancelled."
prompt-expired: "%prefix%<yellow>That input prompt expired. Reopen the menu to try again.</yellow>"
prompt-invalid: "%prefix%<red>That input is not valid.</red>"
visualizer-started: "%prefix%Showing this claim boundary for <white>%seconds%s</white>."
onboarding: "%prefix%Use <white>/gpflags</white> to create, browse and manage claims from one menu."

